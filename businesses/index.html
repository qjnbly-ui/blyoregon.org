<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Bly, Oregon</title>
  <style>
    :root {
      --bg-1: #0f2c24;
      --bg-2: #234d3c;
      --bg-3: #e8d7b9;
      --ink: #f7f2e8;
      --accent: #ffb347;
      --accent-2: #7dd3a8;
      --card: rgba(11, 28, 22, 0.6);
      --border: rgba(255, 255, 255, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Gill Sans", Verdana, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 20%, rgba(255, 179, 71, 0.25), transparent 45%),
        radial-gradient(circle at 80% 10%, rgba(125, 211, 168, 0.25), transparent 40%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 55%, #18382b);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.04),
        rgba(255, 255, 255, 0.04) 2px,
        transparent 2px,
        transparent 12px
      );
      opacity: 0.5;
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      padding: 2.5rem;
      width: min(720px, 90vw);
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      animation: floatIn 0.9s ease-out forwards;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 179, 71, 0.2);
      color: var(--accent);
      border: 1px solid rgba(255, 179, 71, 0.4);
    }

    h1 {
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      margin: 1rem 0 0.5rem;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0.6rem 0;
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
    }

    .callout {
      margin-top: 1.5rem;
      padding: 1rem 1.25rem;
      border-left: 3px solid var(--accent-2);
      background: rgba(125, 211, 168, 0.12);
    }

    a {
      color: inherit;
      text-decoration: none;
      font-weight: 600;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-2);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.75rem;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      background: rgba(255, 179, 71, 0.2);
      border: 1px solid rgba(255, 179, 71, 0.6);
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .home-btn:hover {
      background: rgba(255, 179, 71, 0.32);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
    }

    @keyframes floatIn {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <span class="badge">Under Construction</span>
    <h1>Page Coming Soon</h1>
    <p>We're building something special for Bly, Oregon. Check back soon for updates.</p>
    <p>A place where all local businesses can equally advertise.</p>
    <div class="callout">
      <p>Questions? Reach out at <a class="contact" href="mailto:quentin@quentinnichols.com">quentin@quentinnichols.com</a>.</p>
    </div>
    <a class="home-btn" href="/">Return to Home</a>
    <footer>Developed by Quentin Nichols</footer>
  </main>
</body>
</html>
