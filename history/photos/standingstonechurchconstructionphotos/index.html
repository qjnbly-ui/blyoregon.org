<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standing Stone Church Reconstruction Photos | Bly, Oregon</title>
  <meta name="description" content="Reconstruction photo gallery for Standing Stone Church in Bly, Oregon." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #143227;
      --pine: #214437;
      --moss: #2f5a46;
      --sage: #9fb39f;
      --sand: #f5efe5;
      --clay: #cbb59a;
      --sun: #f4b35b;
      --ink: #1e1f1c;
      --white: #fff;
      --card: #ffffff;
      --shadow: 0 20px 45px rgba(12, 26, 20, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Manrope", "Trebuchet MS", sans-serif;
      color: var(--ink);
      line-height: 1.6;
      background: radial-gradient(circle at 15% 20%, rgba(244, 179, 91, 0.15), transparent 45%),
        radial-gradient(circle at 85% 10%, rgba(159, 179, 159, 0.2), transparent 55%),
        linear-gradient(180deg, #f7f2ea 0%, #fdfcf9 45%, #f3efe9 100%);
    }

    header {
      background: rgba(20, 50, 39, 0.96);
      color: var(--white);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      text-align: center;
    }

    .page-title {
      margin: 0 0 0.4rem;
      font-family: "Fraunces", "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(2rem, 3.6vw, 2.6rem);
      letter-spacing: 0.02em;
      color: var(--white);
    }

    .page-title-secondary {
      margin: 0;
      font-family: "Fraunces", "Times New Roman", serif;
      font-size: clamp(1.15rem, 2.2vw, 1.7rem);
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-title-article {
      margin: 0;
      font-family: "Manrope", "Trebuchet MS", sans-serif;
      font-size: clamp(1.5rem, 2.8vw, 2.1rem);
      color: rgba(255, 255, 255, 0.9);
    }

    .page-subtitle {
      margin: 0;
      max-width: 640px;
      color: var(--white);
      font-family: "Manrope", "Trebuchet MS", sans-serif;
      font-weight: 600;
    }

    .subnav {
      max-width: 1100px;
      margin: 1.2rem auto 0;
      padding: 0 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .subnav a {
      text-decoration: none;
      font-weight: 600;
      color: var(--forest);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(31, 64, 48, 0.2);
      background: rgba(255, 255, 255, 0.8);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3.5rem;
    }

    .section-header {
      font-family: "Fraunces", "Times New Roman", serif;
      font-size: 1.7rem;
      margin: 0 0 1rem;
      color: var(--forest);
    }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

    .card {
      background: #fff;
      border: 1px solid rgba(31, 64, 48, 0.12);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card img { width: 100%; height: 200px; object-fit: cover; display: block; cursor: pointer; }

    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 50; }
    .lightbox.open { display: flex; }
    .lightbox-content { max-width: min(1200px, 92vw); max-height: 86vh; display: flex; flex-direction: column; gap: 0.6em; }
    .lightbox img { width: 100%; max-height: 78vh; object-fit: contain; background: #111; border-radius: 10px; }
    .lightbox-controls { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 0.95em; }
    .lightbox-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 0.4em 0.8em; border-radius: 999px; cursor: pointer; }
    .lightbox-close { position: absolute; top: 16px; right: 16px; }

    footer {
      background: #162f25;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 class="page-title">Bly, Oregon</h1>
      <h2 class="page-title-secondary">Historic Archives: Photos</h2>
      <h3 class="page-title-article">Standing Stone Church Reconstruction</h3>
      <p class="page-subtitle">Cleanup and Rebuilding Photo Gallery</p>
    </div>
  </header>

  <div class="subnav" aria-label="History section navigation">
    <a href="/history/">Home</a>
    <a href="/history/photos/">Back To Photos</a>
  </div>

  <main class="container">
    <section>
      <h2 class="section-header">Gallery</h2>
      <div class="grid" id="photo-grid"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-btn lightbox-close" id="lightbox-close" type="button">Close</button>
    <div class="lightbox-content">
      <img id="lightbox-image" alt="Standing Stone Church reconstruction photo">
      <div class="lightbox-controls">
        <button class="lightbox-btn" id="lightbox-prev" type="button">Prev</button>
        <span id="lightbox-counter"></span>
        <button class="lightbox-btn" id="lightbox-next" type="button">Next</button>
      </div>
    </div>
  </div>

  <footer>
    <p>Bly, Oregon Community Hub | &copy; 2026 blyoregon.org</p>
  </footer>

  <script>
    async function loadGallery() {
      const grid = document.getElementById('photo-grid');
      if (!grid) {
        return;
      }

      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      const lightboxCounter = document.getElementById('lightbox-counter');
      const lightboxPrev = document.getElementById('lightbox-prev');
      const lightboxNext = document.getElementById('lightbox-next');
      const lightboxClose = document.getElementById('lightbox-close');
      let currentIndex = 0;

      let files = [];
      try {
        const response = await fetch('./list.json', { cache: 'no-store' });
        if (!response.ok) {
          return;
        }
        files = await response.json();
      } catch (error) {
        return;
      }

      function openLightbox(index) {
        currentIndex = (index + files.length) % files.length;
        const name = files[currentIndex];
        lightboxImage.src = `./${encodeURIComponent(name)}`;
        lightboxCounter.textContent = `${currentIndex + 1} of ${files.length}`;
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImage.src = '';
      }

      function showNext(delta) {
        if (!files.length) {
          return;
        }
        openLightbox(currentIndex + delta);
      }

      files.forEach((name, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.src = `./${encodeURIComponent(name)}`;
        img.alt = 'Standing Stone Church reconstruction photo';
        img.loading = 'lazy';
        img.addEventListener('click', () => openLightbox(index));

        card.appendChild(img);
        grid.appendChild(card);
      });

      lightboxPrev.addEventListener('click', () => showNext(-1));
      lightboxNext.addEventListener('click', () => showNext(1));
      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (lightbox.classList.contains('open')) {
          if (event.key === 'Escape') {
            closeLightbox();
          } else if (event.key === 'ArrowRight') {
            showNext(1);
          } else if (event.key === 'ArrowLeft') {
            showNext(-1);
          }
        }
      });
    }

    loadGallery();
  </script>
</body>
</html>
