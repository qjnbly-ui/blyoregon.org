<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standing Stone Church Fire Photos | Bly, Oregon</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; color: #333; line-height: 1.6; background: #f7f8f6; }
    header { background: #2a4d3d; color: white; text-align: center; padding: 1.25em 0; }
    nav { background: #233b31; text-align: center; padding: 0.6em; border-top: 3px solid #1a2c25; }
    nav a { color: white; margin: 0 1em; text-decoration: none; font-weight: bold; }
    .archive-head { background: #1e332b; color: #fff; text-align: center; padding: 0.6em 0; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.85rem; }
    .container { max-width: 1100px; margin: auto; padding: 1.5em; }
    .section-header { border-bottom: 3px solid #2a4d3d; padding-bottom: 0.4em; margin-bottom: 1em; color: #2a4d3d; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid #e3e8e3; border-radius: 12px; overflow: hidden; }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; cursor: pointer; }
    .card .cap { padding: 0.6em 0.8em; font-size: 0.92em; color: #556; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 50; }
    .lightbox.open { display: flex; }
    .lightbox-content { max-width: min(1200px, 92vw); max-height: 86vh; display: flex; flex-direction: column; gap: 0.6em; }
    .lightbox img { width: 100%; max-height: 78vh; object-fit: contain; background: #111; border-radius: 10px; }
    .lightbox-controls { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 0.95em; }
    .lightbox-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 0.4em 0.8em; border-radius: 999px; cursor: pointer; }
    .lightbox-close { position: absolute; top: 16px; right: 16px; }
    footer { background: #2a4d3d; color: white; text-align: center; padding: 1em 0; font-size: 0.9em; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      nav a { margin: 0 0.6em; }
    }
  </style>
</head>
<body>
  <div class="archive-head">Bly, Oregon Historic Archives</div>
  <header>
    <h1>Standing Stone Church Fire</h1>
    <p>Fire Day Photo Gallery</p>
  </header>

  <nav>
    <a href="../../index.html">Home</a>
    <a href="../index.html">Photos</a>
    <a href="../../articles/">Articles</a>
  </nav>

  <main class="container">
    <section>
      <h2 class="section-header">Gallery</h2>
      <div class="grid" id="photo-grid"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-btn lightbox-close" id="lightbox-close" type="button">Close</button>
    <div class="lightbox-content">
      <img id="lightbox-image" alt="Standing Stone Church fire photo">
      <div class="lightbox-controls">
        <button class="lightbox-btn" id="lightbox-prev" type="button">Prev</button>
        <span id="lightbox-counter"></span>
        <button class="lightbox-btn" id="lightbox-next" type="button">Next</button>
      </div>
    </div>
  </div>

  <footer>
    <p>Bly, Oregon Community Hub | &copy; 2026 blyoregon.org</p>
  </footer>

  <script>
    async function loadGallery() {
      const grid = document.getElementById('photo-grid');
      if (!grid) {
        return;
      }

      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      const lightboxCounter = document.getElementById('lightbox-counter');
      const lightboxPrev = document.getElementById('lightbox-prev');
      const lightboxNext = document.getElementById('lightbox-next');
      const lightboxClose = document.getElementById('lightbox-close');
      let currentIndex = 0;

      let files = [];
      try {
        const response = await fetch('./list.json', { cache: 'no-store' });
        if (!response.ok) {
          return;
        }
        files = await response.json();
      } catch (error) {
        return;
      }

      function openLightbox(index) {
        currentIndex = (index + files.length) % files.length;
        const name = files[currentIndex];
        lightboxImage.src = `./${encodeURIComponent(name)}`;
        lightboxCounter.textContent = `${currentIndex + 1} of ${files.length}`;
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImage.src = '';
      }

      function showNext(delta) {
        if (!files.length) {
          return;
        }
        openLightbox(currentIndex + delta);
      }

      files.forEach((name, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.src = `./${encodeURIComponent(name)}`;
        img.alt = 'Standing Stone Church fire photo';
        img.loading = 'lazy';
        img.addEventListener('click', () => openLightbox(index));

        const cap = document.createElement('div');
        cap.className = 'cap';
        cap.textContent = 'Fire day photo';

        card.appendChild(img);
        card.appendChild(cap);
        grid.appendChild(card);
      });

      lightboxPrev.addEventListener('click', () => showNext(-1));
      lightboxNext.addEventListener('click', () => showNext(1));
      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (lightbox.classList.contains('open')) {
          if (event.key === 'Escape') {
            closeLightbox();
          } else if (event.key === 'ArrowRight') {
            showNext(1);
          } else if (event.key === 'ArrowLeft') {
            showNext(-1);
          }
        }
      });
    }

    loadGallery();
  </script>
</body>
</html>
