<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Businesses | Bly, Oregon</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --forest:#143227; --card:#fffdf9; --ink:#1e1f1c; --white:#fff; --shadow:0 20px 45px rgba(12,26,20,0.18); }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body {
      margin:0; min-height:100vh; font-family:"Manrope","Trebuchet MS",sans-serif; color:var(--ink);
      background:radial-gradient(circle at 15% 20%, rgba(244, 179, 91, 0.15), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(159, 179, 159, 0.2), transparent 55%),
      linear-gradient(180deg, #f7f2ea 0%, #fdfcf9 45%, #f3efe9 100%);
    }
    header { background:rgba(20,50,39,0.96); color:var(--white); }
    .header-inner { max-width:1080px; margin:0 auto; padding:0.9rem 1.5rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
    .brand-title { font-family:"Fraunces","Times New Roman",serif; font-size:1.4rem; font-weight:700; }
    .brand-subtitle { font-size:0.85rem; color:rgba(255,255,255,0.72); }
    nav { display:flex; gap:0.75rem; align-items:center; }
    nav a { color:var(--white); text-decoration:none; font-weight:600; padding:0.45rem 0.8rem; border-radius:999px; border:1px solid transparent; }
    nav a.account-link { border-color:rgba(255,255,255,0.35); background:rgba(255,255,255,0.12); }
    .shell { max-width:1080px; margin:0 auto; padding:2.5rem 1.5rem 3.5rem; display:grid; gap:1rem; }
    .hero,.card { background:var(--card); border-radius:24px; border:1px solid rgba(31,64,48,0.12); box-shadow:var(--shadow); padding:1.35rem 1.4rem; }
    .hero { background:linear-gradient(140deg, rgba(20, 50, 39, 0.96), rgba(33, 68, 55, 0.88)); color:var(--white); }
    .eyebrow { text-transform:uppercase; letter-spacing:0.18em; font-size:0.76rem; color:rgba(255,255,255,0.72); font-weight:700; }
    .hero h1 { margin:0.35rem 0 0; font-family:"Fraunces","Times New Roman",serif; font-size:clamp(2rem, 6vw, 3rem); }
    .hero p,.meta,.status-copy { margin:0.65rem 0 0; line-height:1.6; }
    .hero p { color:rgba(255,255,255,0.82); }
    .meta,.status-copy { color:#4c5d54; }
    .list { display:grid; gap:1rem; margin-top:1rem; }
    .item { border:1px solid rgba(20,50,39,0.12); border-radius:20px; background:rgba(255,255,255,0.72); padding:1rem; display:grid; gap:0.9rem; }
    .item-header { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; align-items:start; }
    .item-title { font-weight:700; font-size:1.08rem; color:var(--forest); }
    .badge { display:inline-flex; align-items:center; padding:0.3rem 0.65rem; border-radius:999px; background:rgba(20,50,39,0.08); color:var(--forest); font-size:0.8rem; font-weight:700; text-transform:uppercase; }
    .grid { display:grid; gap:0.8rem; grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .field { display:grid; gap:0.35rem; }
    .field.full { grid-column:1 / -1; }
    label { font-size:0.9rem; font-weight:700; color:var(--forest); }
    input,textarea { width:100%; border-radius:14px; border:1px solid rgba(20,50,39,0.14); background:#fff; color:var(--ink); font:inherit; padding:0.8rem 0.9rem; }
    textarea { min-height:110px; resize:vertical; }
    .actions { display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; }
    .button { appearance:none; border-radius:999px; padding:0.78rem 1rem; font:inherit; font-weight:700; cursor:pointer; border:0; background:var(--forest); color:#fff; }
    .button.secondary { background:transparent; color:var(--forest); border:1px solid rgba(20,50,39,0.14); }
    .inline-status { min-height:1.2rem; font-size:0.95rem; color:#4c5d54; }
    .warning { color:#8b322d; }
    footer { background:#162f25; color:rgba(255,255,255,0.7); text-align:center; padding:1.5rem; font-size:0.9rem; }
    @media (max-width:700px) { .shell{padding:1rem 0.75rem 2rem;} .hero,.card{padding:1.1rem 1rem;border-radius:20px;} .grid{grid-template-columns:1fr;} .header-inner{padding:0.75rem 0.9rem;} }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="brand-title">Bly, Oregon</div>
        <div class="brand-subtitle">A Community in Klamath County</div>
      </div>
      <nav>
        <a href="/account/" class="account-link">Account</a>
        <a href="/businesses/">Businesses</a>
      </nav>
    </div>
  </header>

  <div class="shell">
    <section class="hero">
      <div class="eyebrow">Business Owner</div>
      <h1>My businesses</h1>
      <p>These listings are claimed by your account. You can update the live directory details here.</p>
    </section>

    <section class="card">
      <h2>Pending claim requests</h2>
      <div id="pending-claim-list" class="list"></div>
    </section>

    <section class="card">
      <h2>Claimed listings</h2>
      <div id="business-list" class="list"></div>
      <p id="page-status" class="status-copy" aria-live="polite"></p>
    </section>
  </div>

  <footer><p>Bly, Oregon Community Hub | &copy; 2026 blyoregon.org</p></footer>

  <script src="/assets/auth.js"></script>
  <script>
    const listEl = document.getElementById("business-list");
    const pendingListEl = document.getElementById("pending-claim-list");
    const statusEl = document.getElementById("page-status");
    const loginUrl = "/login/?next=" + encodeURIComponent(window.location.pathname);

    function setStatus(message, isError = false) {
      statusEl.classList.toggle("warning", isError);
      statusEl.textContent = message || "";
    }

    function field(labelText, name, value, isArea = false) {
      const label = document.createElement("label");
      label.className = "field";
      const title = document.createElement("span");
      title.textContent = labelText;
      const control = isArea ? document.createElement("textarea") : document.createElement("input");
      control.name = name;
      control.value = value || "";
      label.append(title, control);
      return label;
    }

    function renderBusinesses(businesses) {
      listEl.innerHTML = "";
      if (!businesses.length) {
        const empty = document.createElement("p");
        empty.className = "meta";
        empty.textContent = "No businesses are currently claimed by your account.";
        listEl.appendChild(empty);
        return;
      }

      businesses.forEach((business) => {
        const item = document.createElement("article");
        item.className = "item";

        const header = document.createElement("div");
        header.className = "item-header";
        const titleWrap = document.createElement("div");
        const title = document.createElement("div");
        title.className = "item-title";
        title.textContent = business.businessName || "Untitled business";
        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = business.businessCategory || "Other";
        titleWrap.append(title, meta);
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = String(business.status || "published").replace(/_/g, " ");
        header.append(titleWrap, badge);

        const grid = document.createElement("div");
        grid.className = "grid";
        const descriptionField = field("Description", "description", business.description, true);
        descriptionField.classList.add("full");
        const notesField = field("Notes", "notes", business.notes, true);
        notesField.classList.add("full");
        grid.append(
          field("Business name", "businessName", business.businessName),
          field("Category", "businessCategory", business.businessCategory),
          field("Image URL", "imageUrl", business.imageUrl),
          descriptionField,
          field("Contact person", "contactName", business.contactName),
          field("Phone", "phone", business.phone),
          field("Business email", "businessEmail", business.businessEmail),
          field("Address", "address", business.address),
          field("Website", "websiteUrl", business.websiteUrl),
          field("Hours", "hours", business.hours),
          notesField
        );

        const uploadField = document.createElement("label");
        uploadField.className = "field full";
        const uploadLabel = document.createElement("span");
        uploadLabel.textContent = "Upload image";
        const uploadInput = document.createElement("input");
        uploadInput.type = "file";
        uploadInput.accept = "image/*";
        uploadInput.name = "imageUpload";
        uploadField.append(uploadLabel, uploadInput);
        grid.append(uploadField);

        const actions = document.createElement("div");
        actions.className = "actions";
        const button = document.createElement("button");
        button.type = "button";
        button.className = "button";
        button.textContent = "Save changes";
        const uploadButton = document.createElement("button");
        uploadButton.type = "button";
        uploadButton.className = "button secondary";
        uploadButton.textContent = "Upload image";
        const inlineStatus = document.createElement("div");
        inlineStatus.className = "inline-status";
        inlineStatus.setAttribute("aria-live", "polite");
        actions.append(button, uploadButton, inlineStatus);

        uploadButton.addEventListener("click", async () => {
          const file = uploadInput.files?.[0];
          if (!file) {
            inlineStatus.textContent = "Choose an image first.";
            return;
          }
          const session = await window.siteAuth.getSession().catch(() => null);
          if (!session) {
            window.location.replace(loginUrl);
            return;
          }
          inlineStatus.textContent = "Uploading image...";
          try {
            const prepareResponse = await fetch("/api/businesses", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + session.access_token,
              },
              body: JSON.stringify({
                action: "prepare_image_upload",
                id: business.id,
                filename: file.name,
              }),
            });
            const preparePayload = await prepareResponse.json().catch(() => ({}));
            if (!prepareResponse.ok || !preparePayload.upload?.path || !preparePayload.upload?.token) {
              throw new Error(preparePayload.error || "Unable to prepare image upload.");
            }
            const client = await window.siteAuth.getClient();
            const { error } = await client.storage.from("business-images").uploadToSignedUrl(
              preparePayload.upload.path,
              preparePayload.upload.token,
              file,
              { cacheControl: "3600", upsert: false }
            );
            if (error) throw new Error(error.message || "Unable to upload image.");
            business.imagePath = preparePayload.upload.path;
            grid.querySelector('[name="imageUrl"]').value = preparePayload.upload.publicUrl;
            inlineStatus.textContent = "Image uploaded. Save changes to keep it.";
          } catch (error) {
            inlineStatus.textContent = error.message || "Unable to upload image.";
          }
        });

        button.addEventListener("click", async () => {
          const session = await window.siteAuth.getSession().catch(() => null);
          if (!session) {
            window.location.replace(loginUrl);
            return;
          }

          inlineStatus.textContent = "Saving...";
          try {
            const response = await fetch("/api/businesses", {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + session.access_token,
              },
              body: JSON.stringify({
                id: business.id,
                action: "save",
                businessName: grid.querySelector('[name="businessName"]').value.trim(),
                businessCategory: grid.querySelector('[name="businessCategory"]').value.trim(),
                imagePath: business.imagePath || "",
                imageUrl: grid.querySelector('[name="imageUrl"]').value.trim(),
                description: grid.querySelector('[name="description"]').value.trim(),
                contactName: grid.querySelector('[name="contactName"]').value.trim(),
                phone: grid.querySelector('[name="phone"]').value.trim(),
                businessEmail: grid.querySelector('[name="businessEmail"]').value.trim(),
                address: grid.querySelector('[name="address"]').value.trim(),
                websiteUrl: grid.querySelector('[name="websiteUrl"]').value.trim(),
                hours: grid.querySelector('[name="hours"]').value.trim(),
                notes: grid.querySelector('[name="notes"]').value.trim(),
              }),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || "Unable to save listing.");
            inlineStatus.textContent = "Saved.";
            loadPage();
          } catch (error) {
            inlineStatus.textContent = error.message || "Unable to save listing.";
          }
        });

        item.append(header, grid, actions);
        listEl.appendChild(item);
      });
    }

    function renderPendingClaims(claims) {
      pendingListEl.innerHTML = "";
      if (!claims.length) {
        const empty = document.createElement("p");
        empty.className = "meta";
        empty.textContent = "No pending business claim requests.";
        pendingListEl.appendChild(empty);
        return;
      }

      claims.forEach((business) => {
        const item = document.createElement("article");
        item.className = "item";

        const header = document.createElement("div");
        header.className = "item-header";
        const titleWrap = document.createElement("div");
        const title = document.createElement("div");
        title.className = "item-title";
        title.textContent = business.businessName || "Untitled business";
        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = `${business.businessCategory || "Other"}${business.claimRequestedAt ? " • Requested " + new Date(business.claimRequestedAt).toLocaleString() : ""}`;
        titleWrap.append(title, meta);
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "claim pending";
        header.append(titleWrap, badge);

        const body = document.createElement("p");
        body.className = "meta";
        body.textContent = "This ownership request is waiting for admin approval. Once approved, the listing will move into your claimed businesses below.";

        item.append(header, body);
        pendingListEl.appendChild(item);
      });
    }

    async function loadPage() {
      try {
        const session = await window.siteAuth.getSession();
        if (!session) {
          window.location.replace(loginUrl);
          return;
        }

        const response = await fetch("/api/businesses?scope=mine", {
          headers: { Authorization: "Bearer " + session.access_token },
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 401) {
            await window.siteAuth.logout();
            window.location.replace(loginUrl + "&auth_error=expired");
            return;
          }
          throw new Error(payload.error || "Unable to load your businesses.");
        }

        renderPendingClaims(Array.isArray(payload.pendingClaims) ? payload.pendingClaims : []);
        renderBusinesses(Array.isArray(payload.businesses) ? payload.businesses : []);
        setStatus("");
      } catch (error) {
        setStatus(error.message || "Unable to load your businesses.", true);
      }
    }

    loadPage();
  </script>
</body>
</html>
